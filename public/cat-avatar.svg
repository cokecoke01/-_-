<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="#F1F3F5" stroke="#E2E8F0" stroke-width="3" />
  
  <!-- Cute grey cat body & head -->
  <ellipse cx="60" cy="72" rx="30" ry="26" fill="#8E99A8" />
  <circle cx="60" cy="52" r="26" fill="#A0AEC0" />
  
  <!-- Cat Ears -->
  <polygon points="38,40 32,18 49,30" fill="#8E99A8" stroke="#718096" stroke-width="2" stroke-linejoin="round" />
  <polygon points="40,36 36,22 47,30" fill="#FEB2B2" />
  <polygon points="82,40 88,18 71,30" fill="#8E99A8" stroke="#718096" stroke-width="2" stroke-linejoin="round" />
  <polygon points="80,36 84,22 73,30" fill="#FEB2B2" />

  <!-- Forehead stripes -->
  <path d="M56,32 L56,40 M60,30 L60,41 M64,32 L64,40" stroke="#718096" stroke-width="2.5" stroke-linecap="round" />

  <!-- Eyes - cute cheerful expression -->
  <ellipse cx="48" cy="50" rx="4" ry="5.5" fill="#1A202C" />
  <circle cx="46.5" cy="48" r="1.8" fill="#FFFFFF" />
  <ellipse cx="72" cy="50" rx="4" ry="5.5" fill="#1A202C" />
  <circle cx="70.5" cy="48" r="1.8" fill="#FFFFFF" />

  <!-- Cheeks -->
  <ellipse cx="40" cy="58" rx="5" ry="3" fill="#FC8181" opacity="0.6" />
  <ellipse cx="80" cy="58" rx="5" ry="3" fill="#FC8181" opacity="0.6" />

  <!-- Nose and happy mouth -->
  <polygon points="60,56 57,54 63,54" fill="#E53E3E" />
  <path d="M55,60 Q60,65 60,59 Q60,65 65,60" fill="none" stroke="#2D3748" stroke-width="2" stroke-linecap="round" />

  <!-- Whiskers -->
  <line x1="32" y1="53" x2="44" y2="55" stroke="#CBD5E0" stroke-width="2" stroke-linecap="round" />
  <line x1="30" y1="60" x2="43" y2="59" stroke="#CBD5E0" stroke-width="2" stroke-linecap="round" />
  <line x1="88" y1="53" x2="76" y2="55" stroke="#CBD5E0" stroke-width="2" stroke-linecap="round" />
  <line x1="90" y1="60" x2="77" y2="59" stroke="#CBD5E0" stroke-width="2" stroke-linecap="round" />

  <!-- Paws holding a sparkling golden drink/coffee cup like reference -->
  <ellipse cx="60" cy="74" rx="14" ry="12" fill="#FFFFFF" />
  <rect x="52" y="66" width="16" height="18" rx="3" fill="#ECC94B" stroke="#D69E2E" stroke-width="1.5" />
  <ellipse cx="60" cy="66" rx="8" ry="3" fill="#FEFCBF" />
  <ellipse cx="49" cy="74" rx="5" ry="4" fill="#CBD5E0" />
  <ellipse cx="71" cy="74" rx="5" ry="4" fill="#CBD5E0" />
</svg>
